<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#08090C" />
  <!-- build: v2.2 · 2026-11-04 · draggable + resizable camera overlay -->
  <title>DuelShots</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='16' fill='%2308090C'/%3E%3Ccircle cx='25' cy='32' r='9' fill='none' stroke='%2322D3EE' stroke-width='4'/%3E%3Ccircle cx='39' cy='32' r='9' fill='none' stroke='%23D946EF' stroke-width='4'/%3E%3C/svg%3E" />
  <link rel="stylesheet" href="styles.css?v=4" />
</head>
<body>
  <div class="backdrop" aria-hidden="true">
    <span class="glow g1"></span>
    <span class="glow g2"></span>
    <span class="grid"></span>
  </div>

  <main class="stage">
    <header class="stage-head">
      <div class="stage-brand">
        <span class="stage-dot"></span>
        <span><b>DuelShots</b> <span class="dim">web preview</span> <span class="ver">v2.2</span></span>
      </div>
      <button class="about-btn" id="about-btn" type="button" title="About this preview" aria-label="About this preview">i</button>
    </header>

    <div class="device" id="device">
      <div class="device-inner">
        <div class="island" aria-hidden="true"></div>

        <div class="statusbar">
          <span class="sb-time" id="clock">9:41</span>
          <span class="sb-icons">
            <svg viewBox="0 0 24 24" width="16" height="16" aria-hidden="true"><path d="M2 17.5h3.2v-5H2zm5.4 0H10.6V9H7.4zm5.4 0h3.2V6h-3.2zm5.4 0H21.4V3h-3.2z" fill="currentColor"/></svg>
            <svg viewBox="0 0 24 24" width="16" height="16" aria-hidden="true"><path d="M12 19.8 1.6 8.4A14.7 14.7 0 0 1 22.4 8.4z" fill="currentColor"/></svg>
            <span class="battery"><i></i></span>
          </span>
        </div>

        <div class="app">
          <div class="screen" id="screen"></div>
          <nav class="tabbar" id="tabbar">
            <button class="tab" data-tab="HOME" type="button" aria-label="Home">
              <span class="tab-icon" data-icon="home"></span><span class="tab-label">Home</span>
            </button>
            <button class="tab" data-tab="GALLERY" type="button" aria-label="Gallery">
              <span class="tab-icon" data-icon="gallery"></span><span class="tab-label">Gallery</span>
            </button>
            <button class="tab" data-tab="SETTINGS" type="button" aria-label="Settings">
              <span class="tab-icon" data-icon="settings"></span><span class="tab-label">Settings</span>
            </button>
          </nav>
        </div>

        <div class="home-indicator" aria-hidden="true"></div>
        <div class="modal-root" id="modal-root"></div>
      </div>
    </div>

    <footer class="stage-foot">
      <span class="badge">web preview</span>
      <span>Same UI, settings and recording modes as the Android app</span>
    </footer>
  </main>

  <div class="media-sink" id="media-sink" aria-hidden="true"></div>
  <script src="app.js?v=4"></script>
</body>
</html>
