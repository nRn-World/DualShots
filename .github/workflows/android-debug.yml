name: Android debug APK

on:
  workflow_dispatch:
  push:
    branches:
      - 'arena/d7a3e5d9-dualshots'

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - name: Build debug APK
        shell: bash
        run: |
          set -o pipefail
          if ! bash gradlew :app:assembleDebug --no-daemon >build.log 2>&1; then
            grep -E '(^e: |^FAILURE:|^\* What went wrong:|^> |^\* Where:)' build.log | tail -n 35 | while IFS= read -r line; do echo "::error::$line"; done
            tail -n 100 build.log
            SUMMARY=$(tail -n 80 build.log | sed ':a;N;$!ba;s/%/%25/g;s/\r/%0D/g;s/\n/%0A/g')
            echo "::error title=Build log::$SUMMARY"
            exit 1
          fi
      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: DualShots-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14
