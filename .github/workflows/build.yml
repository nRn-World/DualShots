name: Build Android APK

on:
  push:
    branches:
      - "**"
  pull_request:
    branches:
      - main

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Set up JDK 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"

      - name: Build Debug APK
        shell: bash
        run: |
          set -eo pipefail
          SDK_DIR="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-/usr/local/lib/android/sdk}}"
          if [ ! -d "$SDK_DIR" ]; then
            mkdir -p "$HOME/android-sdk/cmdline-tools"
            curl -fsSL https://dl.google.com/android/repository/commandlinetools-linux-11076708_latest.zip -o /tmp/cmdline.zip
            unzip -q /tmp/cmdline.zip -d "$HOME/android-sdk/cmdline-tools"
            mv "$HOME/android-sdk/cmdline-tools/cmdline-tools" "$HOME/android-sdk/cmdline-tools/latest"
            SDK_DIR="$HOME/android-sdk"
          fi
          export ANDROID_HOME="$SDK_DIR"
          export ANDROID_SDK_ROOT="$SDK_DIR"
          echo "sdk.dir=$SDK_DIR" > local.properties
          SDKMANAGER=$(find "$SDK_DIR" -name sdkmanager -type f | head -n 1 || true)
          if [ -n "$SDKMANAGER" ]; then
            yes | "$SDKMANAGER" --licenses >/dev/null 2>&1 || true
          fi

          chmod +x gradlew
          if ! ./gradlew :app:assembleDebug -Dorg.gradle.java.home="$JAVA_HOME" --no-daemon --stacktrace >build.log 2>&1; then
            ERR_SUMMARY=$(grep -E "(^e: |FAILURE:|What went wrong:|^\* |Exception|Error)" build.log | tail -n 35 | tr '\n' ' ' | sed 's/%/%25/g')
            TAIL_LOG=$(tail -n 45 build.log | tr '\n' ' ' | sed 's/%/%25/g')
            echo "::error title=GradleError::${ERR_SUMMARY}"
            echo "::error title=GradleTail::${TAIL_LOG}"
            cat build.log
            exit 1
          fi

      - name: Publish APK to GitHub Releases
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          cp app/build/outputs/apk/debug/app-debug.apk DualShots-v1.5.1-debug.apk
          NOTES="Uppdaterad DualShots v1.5.1 (bugfix):
          - Fixat crash i Gallery/spelaren: appen frågade inte efter läspermission för media, så VideoView/MediaMetadataRetriever kastade SecurityException och stängde ner appen. Läste-tillbaka-permission (READ_EXTERNAL_STORAGE/READ_MEDIA_VIDEO) läggs till och begärs vid start, och alla media-anrop wrappas så att SecurityException aldrig crashar.
          - Ny Stats-skärm, mappar i Gallery, clipspelare med tidslinje och thumbnail-filmstrip, favorites-genväg — allt från v1.5"
          if gh release view v0.2.0 >/dev/null 2>&1; then
            gh release upload v0.2.0 app/build/outputs/apk/debug/app-debug.apk DualShots-v1.5.1-debug.apk --clobber
            gh release edit v0.2.0 --title "DualShots v1.5.1" --notes "$NOTES"
          else
            gh release create v0.2.0 app/build/outputs/apk/debug/app-debug.apk DualShots-v1.5.1-debug.apk \
              --target "${{ github.sha }}" \
              --title "DualShots v1.5.1" \
              --notes "$NOTES"
          fi
